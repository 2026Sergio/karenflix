<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KarenFlix · Explorar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="CSS/styles.css">
</head>
<body>
<div id="app-header"></div>
<main class="wrap">
  <div class="page-h"><h1 id="title">Explorar</h1><p id="count"></p></div>
  <div class="chips" id="chips"></div>
  <div class="filters">
    <select id="fTipo" aria-label="Tipo"><option value="">Todos los tipos</option><option value="pelicula">Películas</option><option value="serie">Series</option><option value="anime">Anime</option></select>
    <select id="fOrden" aria-label="Ordenar"><option value="recientes">Más recientes</option><option value="ranking">Mejor ranking</option><option value="popularidad">Más popular</option></select>
    <input id="fQ" placeholder="Filtrar por título…" aria-label="Buscar">
  </div>
  <div class="grid" id="grid"><div class="spin">Cargando…</div></div>
</main>
<div id="app-footer"></div>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/peliculas.js"></script>
</body>
</html>
